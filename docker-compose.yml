services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No "ports:" mapping - Postgres is reachable only from the internal
    # docker network (backend), never exposed to the public internet
    # (spec section 25/18).

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "AI School Management Platform"
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_PREFIX: /api
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MFA_ISSUER_NAME: "AI School Dashboard"
      PASSWORD_MIN_LENGTH: 12
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_DIGIT: "true"
      PASSWORD_REQUIRE_SPECIAL: "true"
      MAX_FAILED_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 15
      LOGIN_RATE_LIMIT: "10/minute"
      GLOBAL_RATE_LIMIT: "100/minute"
      CORS_ORIGINS: https://dashboard.rawadaltarh.com
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage/attachments
      MAX_UPLOAD_SIZE_MB: 15
      ALLOWED_ATTACHMENT_TYPES: "application/pdf,image/png,image/jpeg,image/webp"
      DEFAULT_CURRENCY: SAR
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_FULL_NAME: "System Administrator"
    volumes:
      - attachments_storage:/app/storage/attachments
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No "ports:" mapping - only nginx talks to the backend, over the
    # internal network. Nothing here is directly internet-facing.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      - backend
      - frontend
    # The nginx config is written inline via `command` rather than mounted
    # from ./nginx/nginx.conf. This avoids relying on that file existing at
    # a specific host path relative to docker-compose.yml on every deploy
    # target (a bind-mount of a missing file silently becomes an empty
    # directory in Docker, which breaks nginx startup with a confusing
    # "not a directory" mount error - inlining the config here removes
    # that failure mode entirely). To switch to the full HTTPS config
    # after certbot issues a certificate, replace the heredoc content below
    # with nginx/nginx.conf.https-full's contents and restart this service.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/http.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name dashboard.rawadaltarh.com;

            location /.well-known/acme-challenge/ {
                root /var/www/certbot;
            }

            location /api/ {
                proxy_pass http://backend:8000/api/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_read_timeout 60s;
            }

            location /health {
                proxy_pass http://backend:8000/health;
                proxy_set_header Host $$host;
            }

            location / {
                proxy_pass http://frontend:80;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        NGINXCONF

        # Wait for certbot to obtain the certificate (checked every 5s, up
        # to ~2 minutes) before switching this config over to HTTPS. If it
        # never appears, nginx just keeps serving plain HTTP indefinitely -
        # never crashes waiting for a cert that didn't issue.
        for i in $$(seq 1 24); do
          if [ -f /etc/letsencrypt/live/dashboard.rawadaltarh.com/fullchain.pem ]; then
            cat > /etc/nginx/conf.d/http.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name dashboard.rawadaltarh.com;
            location /.well-known/acme-challenge/ {
                root /var/www/certbot;
            }
            location / {
                return 301 https://$$host$$request_uri;
            }
        }
        NGINXCONF
            cat > /etc/nginx/conf.d/https.conf << 'NGINXCONF'
        server {
            listen 443 ssl http2;
            server_name dashboard.rawadaltarh.com;

            ssl_certificate     /etc/letsencrypt/live/dashboard.rawadaltarh.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/dashboard.rawadaltarh.com/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            ssl_prefer_server_ciphers on;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            client_max_body_size 20M;

            location /api/ {
                proxy_pass http://backend:8000/api/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_read_timeout 60s;
            }

            location /health {
                proxy_pass http://backend:8000/health;
                proxy_set_header Host $$host;
            }

            location / {
                proxy_pass http://frontend:80;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        NGINXCONF
            nginx -s reload
            break
          fi
          sleep 5
        done

        exec nginx -g 'daemon off;'

  # DNS-01 based certbot: HTTP-01 failed with a connection timeout from
  # Let's Encrypt's validation servers (see deployment notes), so this uses
  # DNS-01 instead, which needs no inbound connection to the VPS at all.
  # The auth hook prints the required TXT record to this container's logs
  # and waits (polling public DNS) for it to appear - the deploying
  # operator adds it via the Hostinger DNS API in the meantime. Not
  # restart:-managed on purpose: this runs once to get the first
  # certificate, then exits; renewal is handled by a separate cron-driven
  # step once DNS-01 automation is fully wired up.
  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache python3 bind-tools > /dev/null 2>&1 || true
        cat > /hostinger_dns_hook.py << 'HOOKEOF'
        import json, os, subprocess, sys, time

        def _root_domain(d):
            p = d.split(".")
            return ".".join(p[-2:])

        def _record_name(d, root):
            prefix = d[: -(len(root) + 1)] if d != root else ""
            return f"_acme-challenge.{prefix}" if prefix else "_acme-challenge"

        def _resolves(fqdn, expected):
            try:
                out = subprocess.run(["nslookup", "-type=TXT", fqdn, "8.8.8.8"], capture_output=True, text=True, timeout=10).stdout
                return expected in out
            except Exception:
                return False

        def auth():
            domain = os.environ["CERTBOT_DOMAIN"]
            validation = os.environ["CERTBOT_VALIDATION"]
            root = _root_domain(domain)
            name = _record_name(domain, root)
            fqdn = f"{name}.{root}"
            print("=" * 70, file=sys.stderr)
            print("ACME DNS-01 CHALLENGE - ACTION NEEDED", file=sys.stderr)
            print(f"  TXT record name:  {name}", file=sys.stderr)
            print(f"  TXT record value: {validation}", file=sys.stderr)
            print(f"  (zone: {root}, full name: {fqdn})", file=sys.stderr)
            print("=" * 70, file=sys.stderr)
            for _ in range(36):
                if _resolves(fqdn, validation):
                    print("Record is publicly visible - proceeding.", file=sys.stderr)
                    return
                time.sleep(10)
            print("Timed out waiting for the TXT record to appear.", file=sys.stderr)

        def cleanup():
            print("Challenge step done.", file=sys.stderr)

        if __name__ == "__main__":
            mode = sys.argv[1] if len(sys.argv) > 1 else ""
            if mode == "auth":
                auth()
            elif mode == "cleanup":
                cleanup()
        HOOKEOF
        certbot certonly --manual --preferred-challenges dns \
          --manual-auth-hook 'python3 /hostinger_dns_hook.py auth' \
          --manual-cleanup-hook 'python3 /hostinger_dns_hook.py cleanup' \
          -d dashboard.rawadaltarh.com --email admin@rawadaltarh.com \
          --agree-tos --no-eff-email --non-interactive

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  attachments_storage:
  certbot_certs:
  certbot_www:
