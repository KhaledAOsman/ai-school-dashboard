# Every container's logs rotate (3 x 10 MB) so docker logs can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Tuned for the 1 vCPU / 4 GB VPS: ~25 % of RAM for shared buffers, slow
    # queries (> 500 ms) written to the log, pg_stat_statements loaded so
    # the slowest statements can be listed (see deploy/RUNBOOK.md).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - idle_in_transaction_session_timeout=60000
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 1200M
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No "ports:" mapping - Postgres is reachable only from the internal
    # docker network (backend), never exposed to the public internet
    # (spec section 25/18).

  # Shared cache + rate-limit counters. Internal network only (no ports),
  # password protected, memory capped with LRU eviction, no persistence:
  # everything in it is rebuildable, so a restart just means a cold cache.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-school-backend:${APP_VERSION:-latest}
    pull_policy: build   # local image, never look for it on Docker Hub
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      APP_NAME: "AI School Management Platform"
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_PREFIX: /api
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MFA_ISSUER_NAME: "AI School Dashboard"
      PASSWORD_MIN_LENGTH: 12
      PASSWORD_REQUIRE_UPPERCASE: "true"
      PASSWORD_REQUIRE_LOWERCASE: "true"
      PASSWORD_REQUIRE_DIGIT: "true"
      PASSWORD_REQUIRE_SPECIAL: "true"
      MAX_FAILED_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 15
      # Rate limits per kind ("count/seconds") - see backend/app/middleware/rate_limit.py
      RATE_LIMIT_LOGIN: "10/60"
      RATE_LIMIT_LOGIN_ACCOUNT: "20/3600"
      RATE_LIMIT_AUTH: "20/60"
      RATE_LIMIT_RESET_ACCOUNT: "5/3600"
      RATE_LIMIT_UPLOAD: "20/60"
      RATE_LIMIT_HEAVY: "60/60"
      RATE_LIMIT_API: "300/60"
      RATE_LIMIT_API_IP: "600/60"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      CACHE_DEFAULT_TTL: 60
      # 2 workers x (5 + 5) connections = 20 max, well under max_connections=60
      UVICORN_WORKERS: 2
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      CORS_ORIGINS: https://dashboard.rawadaltarh.com
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage/attachments
      MAX_UPLOAD_SIZE_MB: 15
      ALLOWED_ATTACHMENT_TYPES: "application/pdf,image/png,image/jpeg,image/webp"
      DEFAULT_CURRENCY: SAR
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_FULL_NAME: "System Administrator"
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3001
    volumes:
      - attachments_storage:/app/storage/attachments
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /ready = process up AND database reachable (not just "process alive")
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No "ports:" mapping - only nginx talks to the backend, over the
    # internal network. Nothing here is directly internet-facing.

  # WhatsApp bridge - see whatsapp-service/server.js for the full
  # rationale/risk notes. Internal-only (no published port): the Python
  # backend is the only caller, over the internal docker network.
  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - whatsapp_session:/app/wwebjs_auth
    networks:
      - internal
    # No healthcheck - whatsapp-web.js can legitimately sit in
    # "qr_pending" (unlinked) for long periods without that being a
    # failure; the /status endpoint is polled by the backend/frontend
    # instead of Docker's own healthcheck semantics.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-school-frontend:${APP_VERSION:-latest}
    pull_policy: build   # local image, never look for it on Docker Hub
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    # The nginx config is written inline via `command` rather than mounted
    # from ./nginx/nginx.conf. This avoids relying on that file existing at
    # a specific host path relative to docker-compose.yml on every deploy
    # target (a bind-mount of a missing file silently becomes an empty
    # directory in Docker, which breaks nginx startup with a confusing
    # "not a directory" mount error - inlining the config here removes
    # that failure mode entirely).
    #
    # Layout:
    #   /etc/nginx/conf.d/00-common.conf  real client IP (Cloudflare), gzip,
    #                                     edge rate-limit zones, hide version
    #   /etc/nginx/snippets/app.conf      the proxied locations + security
    #                                     headers, shared by HTTP and HTTPS
    #   http.conf / https.conf            the servers (HTTPS once the
    #                                     certificate exists)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/nginx/snippets
        rm -f /etc/nginx/conf.d/default.conf
        cat > /etc/nginx/conf.d/00-common.conf << 'NGINXCONF'
        server_tokens off;

        # ---- Real client IP --------------------------------------------
        # Requests arriving through Cloudflare carry the visitor's address in
        # CF-Connecting-IP. It is trusted ONLY from Cloudflare's published
        # ranges (https://www.cloudflare.com/ips/), so nobody can spoof it by
        # sending the header directly. Without Cloudflare nothing changes.
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        # ---- Compression (JSON from the API; static files are gzipped by
        # the frontend container already) -----------------------------------
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/json text/css application/javascript image/svg+xml text/plain;

        # ---- Edge rate limiting (a first, cheap wall in front of the API;
        # the backend keeps the finer per-user / per-account limits) --------
        limit_req_zone $$binary_remote_addr zone=edge_login:10m rate=10r/m;
        limit_req_zone $$binary_remote_addr zone=edge_api:10m rate=20r/s;
        limit_conn_zone $$binary_remote_addr zone=edge_conn:10m;
        limit_req_status 429;
        limit_conn_status 429;

        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 30s;
        NGINXCONF

        cat > /etc/nginx/snippets/app.conf << 'NGINXCONF'
        client_max_body_size 20M;
        limit_conn edge_conn 40;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        location /api/auth/login {
            limit_req zone=edge_login burst=5 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/snippets/proxy.conf;
        }

        location /api/ {
            limit_req zone=edge_api burst=60 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/snippets/proxy.conf;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }

        # the API docs / openapi are disabled in production by the backend;
        # never proxy anything else from it
        location / {
            proxy_pass http://frontend:80;
            include /etc/nginx/snippets/proxy.conf;
        }
        NGINXCONF

        cat > /etc/nginx/snippets/proxy.conf << 'NGINXCONF'
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $$host;
        # overwritten, never appended: the backend trusts these two headers
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$remote_addr;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_set_header CF-Connecting-IP "";
        # the edge sets the security headers once; drop the upstream copies
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        NGINXCONF

        cat > /etc/nginx/conf.d/http.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name dashboard.rawadaltarh.com;

            location /.well-known/acme-challenge/ {
                root /var/www/certbot;
            }

            include /etc/nginx/snippets/app.conf;
        }
        NGINXCONF

        CERT=/etc/letsencrypt/live/dashboard.rawadaltarh.com/fullchain.pem
        use_https() {
        cat > /etc/nginx/conf.d/http.conf << 'NGINXCONF'
        server {
            listen 80;
            server_name dashboard.rawadaltarh.com;
            location /.well-known/acme-challenge/ {
                root /var/www/certbot;
            }
            location = /nginx-health {
                access_log off;
                return 200 "ok";
            }
            location / {
                return 301 https://$$host$$request_uri;
            }
        }
        NGINXCONF
        cat > /etc/nginx/conf.d/https.conf << 'NGINXCONF'
        server {
            # same listen style as the other sites mounted into conf.d (nsma.conf)
            listen 443 ssl http2;
            server_name dashboard.rawadaltarh.com;

            ssl_certificate     /etc/letsencrypt/live/dashboard.rawadaltarh.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/dashboard.rawadaltarh.com/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 1d;
            ssl_session_tickets off;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            include /etc/nginx/snippets/app.conf;
        }
        NGINXCONF
        }

        # Certificate already there (every normal restart): start directly
        # in HTTPS mode. Otherwise serve HTTP now and switch over in the
        # background as soon as certbot delivers the certificate - nginx
        # never waits for (or crashes on) a certificate that didn't issue.
        if [ -f "$$CERT" ]; then
          use_https
        else
          (
            for i in $$(seq 1 120); do
              sleep 5
              if [ -f "$$CERT" ]; then
                use_https
                nginx -t && nginx -s reload
                break
              fi
            done
          ) &
        fi

        exec nginx -g 'daemon off;'

  # DNS-01 certbot: HTTP-01 consistently times out for Let's Encrypt's
  # validation servers specifically (confirmed: the port/path work fine
  # for normal browser traffic and for curl from this deployment's own
  # region - see deployment notes - this is a network-path issue between
  # Let's Encrypt and this VPS's IP, not a config problem). DNS-01 needs no
  # inbound connection to the VPS at all, only that a TXT record is
  # publicly visible - so it sidesteps the issue entirely.
  #
  # This uses --manual with a plain-sh auth hook (no python/package install
  # needed - certbot's own image already has sh). The hook writes the
  # required record name+value to this container's logs and polls public
  # DNS (via getent, no extra tools needed) for up to ~6 minutes waiting
  # for it to appear - the deploying operator adds it via the Hostinger
  # DNS API in the meantime.
  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /auth-hook.sh << 'HOOKEOF'
        #!/bin/sh
        echo "AUTH HOOK CALLED" >&2
        root=$$(echo "$$CERTBOT_DOMAIN" | awk -F. '{print $$(NF-1)"."$$NF}')
        prefix=$${CERTBOT_DOMAIN%.$$root}
        if [ "$$prefix" = "$$CERTBOT_DOMAIN" ]; then
          name="_acme-challenge"
        else
          name="_acme-challenge.$$prefix"
        fi
        fqdn="$$name.$$root"
        echo "======================================================================"
        echo "ACME DNS-01 CHALLENGE - ACTION NEEDED"
        echo "  TXT record name:  $$name"
        echo "  TXT record value: $$CERTBOT_VALIDATION"
        echo "  (zone: $$root, full name: $$fqdn)"
        echo "======================================================================"
        i=0
        while [ $$i -lt 36 ]; do
          if getent hosts "$$fqdn" > /dev/null 2>&1 || nslookup -type=TXT "$$fqdn" 2>/dev/null | grep -q "$$CERTBOT_VALIDATION"; then
            echo "Record appears to be visible - proceeding."
            exit 0
          fi
          sleep 10
          i=$$((i + 1))
        done
        echo "Timed out waiting for the TXT record - proceeding anyway (final check happens at Let's Encrypt regardless)."
        HOOKEOF
        chmod +x /auth-hook.sh
        echo "=== Starting certbot with verbose output ==="
        timeout 300 certbot certonly -v --manual --preferred-challenges dns \
          --manual-auth-hook /auth-hook.sh \
          -d dashboard.rawadaltarh.com --email admin@rawadaltarh.com \
          --agree-tos --no-eff-email --non-interactive 2>&1 || true
        echo "Certbot step finished (see above for success/failure)."

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  attachments_storage:
  certbot_certs:
  certbot_www:
  whatsapp_session:
