# ACTIVE CONFIG - currently the HTTP-only bootstrap version.
#
# This file starts as HTTP-only so the site comes up successfully on first
# deploy and can pass certbot's HTTP-01 challenge (a certificate can't be
# requested for a domain that isn't reachable yet). Once
# docs/deployment.md's certbot step succeeds, replace this file's contents
# with nginx.conf.https-full and restart the nginx container to switch to
# full HTTPS with a redirect.
server {
    listen 80;
    server_name dashboard.rawadaltarh.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
