name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-123456
      ENVIRONMENT: development
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: "Ci#Admin-Pass-2026"
      SEED_ADMIN_FULL_NAME: CI Admin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt pip-audit
      - name: Compile
        run: python -m compileall -q app scripts alembic
      - name: Migrations (up, down one, up again)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Seed
        run: python -m scripts.seed_initial_data
      - name: API smoke test
        run: |
          uvicorn app.main:app --port 8000 --workers 2 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python -m scripts.smoke_test http://127.0.0.1:8000 "$SEED_ADMIN_EMAIL" "$SEED_ADMIN_PASSWORD"
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build
      - name: Dependency vulnerabilities (production deps, critical; see deploy/RUNBOOK.md for the accepted xlsx advisory)
        run: npm audit --omit=dev --audit-level=critical

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-school-${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Image size
        run: docker image ls ai-school-${{ matrix.service }}:ci
      - name: Scan image (Trivy - fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ai-school-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
