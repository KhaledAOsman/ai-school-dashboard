# LOCAL DEVELOPMENT override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# This swaps the production nginx.conf (HTTPS, real domain, certbot) for a
# plain-HTTP config suitable for testing on http://localhost, and disables
# the certbot service (no certificates to renew locally).
services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  certbot:
    profiles:
      - production-only
